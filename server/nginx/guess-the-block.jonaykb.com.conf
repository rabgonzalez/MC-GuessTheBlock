# nginx for the Guess the Block server (API + WebSocket).
#
#   sudo cp server/nginx/guess-the-block.jonaykb.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/guess-the-block.jonaykb.com.conf /etc/nginx/sites-enabled/
#
# First certificate (the 443 block below needs it to exist, so comment it out
# until then, or start with only the port 80 block):
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d guess-the-block.jonaykb.com
# Renewals go through the same /.well-known/acme-challenge/ location.

# Upgrade only the requests that ask for it (the /ws duels).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream guess_the_block {
    server 127.0.0.1:3107; # GTB_PORT in server/docker-compose.yml
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name guess-the-block.jonaykb.com;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "http2" on the listen line works on any nginx; from 1.25.1 you can
    # write "listen 443 ssl;" plus "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guess-the-block.jonaykb.com;

    ssl_certificate     /etc/letsencrypt/live/guess-the-block.jonaykb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guess-the-block.jonaykb.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16k;

    # Also here, in case something asks for it over HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Duels: WebSocket. Long timeouts; the server pings every 30 s.
    location = /ws {
        proxy_pass http://guess_the_block;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # REST API: link challenges, lookup, health.
    location /api/ {
        proxy_pass http://guess_the_block;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

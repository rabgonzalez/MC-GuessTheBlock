name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guessTheBlock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guessTheBlock/package-lock.json

      # Electron is only needed for the desktop build: skip its binary download
      # and the electron-builder postinstall.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Lint
        run: npx vue-cli-service lint --no-fix
        env:
          ELECTRON_OVERRIDE_DIST_PATH: /tmp

      # `prebuild` generates public/data/blocks.json from FakeApi.json.
      # ELECTRON_OVERRIDE_DIST_PATH: vue-cli-plugin-electron-builder requires
      # the `electron` module at load time, even for a plain web build.
      - name: Build
        run: npm run build
        env:
          ELECTRON_OVERRIDE_DIST_PATH: /tmp

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: guessTheBlock/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
